[colors.bright]
black = "#293D42"
blue = "#5C88C8"
cyan = "#6AC0CC"
green = "#6EAA78"
magenta = "#9070B0"
red = "#C87878"
white = "#D0E4E8"
yellow = "#B8A060"

[colors.cursor]
cursor = "#5C88C8"
text = "#203033"

[colors.normal]
black = "#1A2B2E"
blue = "#4468A8"
cyan = "#509898"
green = "#508A58"
magenta = "#705888"
red = "#A06060"
white = "#90B4BC"
yellow = "#907A48"

[colors.primary]
background = "#203033"
foreground = "#C2D6DA"

[colors.selection]
background = "#2C444E"
text = "#A8C8CE"

[cursor.style]
shape = "Block"

[font]
size = 10 

[font.normal]
family = "IBM Plex Mono"

[scrolling]
history = 10000

[window]
padding= {x=5, y=5}

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[env]
WINIT_X11_SCALE_FACTOR = "1.0"
